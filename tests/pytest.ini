[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: mark test as unit test (no GPU, fast)
    gpu: mark test as requiring GPU
    multi_gpu: mark test as requiring multiple GPUs (2+)
    slow: mark test as slow-running (>30 seconds)
    integration: mark test as end-to-end integration test

# Default options
addopts = -v --tb=short

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
